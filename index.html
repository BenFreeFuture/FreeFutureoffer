<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>录取捷报生成器 · 自由未来 FreeFuture</title>
<style>
:root{--red:#C20F08;--red-d:#9A0C06;--ink:#2B2B2B;--muted:#7A7A7A}
*{box-sizing:border-box}
body{margin:0;background:#FFFFFF;color:var(--ink);
  font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 20px 44px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:520px;text-align:center}
.logo{width:190px;max-width:62%;height:auto;margin:0 auto 24px;display:block}
h1{font-size:27px;font-weight:600;margin:0 0 12px;letter-spacing:.5px}
.sub{font-size:15px;line-height:1.75;color:#4A4A4A;margin:0 0 32px}
.sub b{color:var(--red);font-weight:600}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;min-height:78px;background:var(--red);color:#fff;text-decoration:none;
  border-radius:18px;font-size:21px;font-weight:600;line-height:1.35;padding:20px 22px;
  box-shadow:0 8px 22px rgba(194,15,8,.26);transition:background .15s,transform .08s}
.bigbtn:hover{background:var(--red-d)}
.bigbtn:active{transform:translateY(1px);box-shadow:0 4px 12px rgba(194,15,8,.22)}
.arrow{font-size:22px}
.steps{margin:28px auto 0;text-align:left;max-width:380px;font-size:13.5px;color:var(--muted);line-height:2}
.steps i{font-style:normal;color:var(--red);font-weight:600;margin-right:8px}
.foot{margin-top:36px;font-size:12px;color:#9A9A9A;line-height:1.85}
.foot a{color:var(--muted);text-decoration:none;border-bottom:1px solid #DDD;padding-bottom:1px}
@media (max-width:360px){h1{font-size:23px}.bigbtn{font-size:18px;min-height:70px}}
</style></head>
<body>
<div class="wrap">
  <img class="logo" src="https://workbuddy-space-static.codebuddy.work/image/a7bUezBH1GCFw8Cm5iqvbd.jpg" alt="自由未来 FreeFuture" onerror="this.style.display='none'">
  <h1>录取捷报生成器</h1>
  <p class="sub">把学生的 <b>Offer 截图</b> 传进来，自动识别学校、专业、学位，<br>自动打码姓名、电话、申请号，一键出品牌捷报海报。</p>
  <a class="bigbtn" href="/generator.html"><span class="arrow">▶</span>上传 Offer 截图，开始制作</a>
  <div class="steps">
    <div><i>1</i>上传 Offer 截图（PNG / JPG）</div>
    <div><i>2</i>自动识别学校专业学位 + 自动打码隐私</div>
    <div><i>3</i>下载 JPG，直接发朋友圈 / 公众号</div>
  </div>
  <div class="foot">
    自由未来 FreeFuture · 内部工具<br>
    <a href="/cover/">看看做出来长什么样</a>
  </div>
</div>
</body></html>
